{% extends 'base.html' %}{% block title %}Profile{% endblock %}
{% block content %}

<h2 class="page-heading mb-4"><i class="bi bi-person-circle"></i> Edit Profile</h2>

<form method="post" class="card card-body col-md-6" style="border-radius:16px;">
  <div class="mb-3">
    <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
    <input class="form-control" value="{{ g.user.email }}" disabled style="background:#f8fafc; color:var(--emp-muted);">
    <div class="form-text">Email address cannot be changed.</div>
  </div>
  <div class="mb-3">
    <label class="form-label"><i class="bi bi-person me-1"></i>Full Name</label>
    <input name="name" class="form-control" value="{{ g.user.name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label"><i class="bi bi-telephone me-1"></i>Phone</label>
    <input name="phone" class="form-control" value="{{ g.user.phone or '' }}" placeholder="e.g. +91 98765 43210">
  </div>
  <div class="mb-3">
    <label class="form-label"><i class="bi bi-building me-1"></i>Department</label>
    <input name="department" class="form-control" value="{{ g.user.department or '' }}" placeholder="e.g. Computer Science">
  </div>
  <div class="mb-3">
    <label class="form-label"><i class="bi bi-123 me-1"></i>Roll No.</label>
    <input name="roll_no" class="form-control" value="{{ g.user.roll_no or '' }}" placeholder="e.g. CS2021001">
  </div>
  <div>
    <button class="btn btn-primary px-4">
      <i class="bi bi-check2 me-1"></i>Save Changes
    </button>
  </div>
</form>

{% endblock %}
