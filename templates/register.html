{% extends 'base.html' %}{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm" style="border-radius:16px; overflow:hidden;">

      <div class="auth-header" style="padding:1.5rem 2rem 1.2rem;">
        <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus me-2"></i>Create Account</h4>
        <p class="mt-1 mb-0" style="font-size:0.85rem; opacity:0.85;">Fill in your details to get started</p>
      </div>

      <div class="card-body p-4">
        <form method="post">

          <div class="mb-3">
            <label class="form-label">I am registering as</label>
            <select name="role" class="form-select">
              <option value="student">🎓 Student</option>
              <option value="examiner">🧑‍🏫 Examiner <small>(requires Admin approval)</small></option>
            </select>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label"><i class="bi bi-person me-1"></i>Full Name</label>
              <input name="name" class="form-control" placeholder="e.g. Niranjan Nagar" required>
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="bi bi-lock me-1"></i>Password <small class="text-muted">(min 6 chars)</small></label>
              <input type="password" name="password" minlength="6" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="bi bi-telephone me-1"></i>Phone</label>
              <input name="phone" class="form-control" placeholder="+91 98765 43210">
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="bi bi-building me-1"></i>Department</label>
              <input name="department" class="form-control" placeholder="e.g. Computer Science">
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="bi bi-123 me-1"></i>Roll No. <small class="text-muted">(students)</small></label>
              <input name="roll_no" class="form-control" placeholder="e.g. CS2021001">
            </div>
          </div>

          <div class="mt-4">
            <button class="btn btn-primary w-100 py-2" style="font-weight:600;">
              <i class="bi bi-check2-circle me-1"></i> Register
            </button>
          </div>

        </form>
        <p class="mt-3 mb-0 text-center" style="font-size:0.85rem; color:var(--emp-muted)">
          Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">Sign in</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
