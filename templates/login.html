{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card card">
    <div class="auth-header">
      <div style="font-size:2.5rem; margin-bottom:0.5rem;">📝</div>
      <h1>EMP</h1>
      <p>Examination Management Portal</p>
    </div>
    <div class="auth-body">
      <h5 class="fw-bold mb-4" style="color:var(--emp-text)">Sign in to your account</h5>
      <form method="post">
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-envelope me-1"></i>Email address</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary w-100 py-2" style="font-size:0.95rem; font-weight:600;">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>
      <hr class="my-3">
      <p class="mb-0 text-center" style="font-size:0.85rem; color:var(--emp-muted)">
        New here? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-decoration-none">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
